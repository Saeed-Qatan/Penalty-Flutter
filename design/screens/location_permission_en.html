<!DOCTYPE html>
<html class="dark" dir="ltr" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SCR-GEO-01: Location Permission</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#38ff14",
                        "primary-dark": "#2dcc10",
                        "secondary-blue": "#2979FF",
                        "background-light": "#f6f8f5",
                        "background-dark": "#121212",
                        "surface-dark": "#1e1e1e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "IBM Plex Sans Arabic", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "IBM Plex Sans Arabic", "sans-serif"],
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 3s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }

        /* Map pin pulse effect */
        .map-pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background-color: rgba(56, 255, 20, 0.2);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .map-pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .map-pulse-ring:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes pulse-ring {
            0% {
                width: 60px;
                height: 60px;
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                width: 250px;
                height: 250px;
                opacity: 0;
            }
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex flex-col items-center justify-between relative overflow-hidden">

    <!-- Top Glow Effect -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[300px] bg-gradient-to-b from-primary/10 to-transparent pointer-events-none z-0"></div>

    <!-- Main Content Container -->
    <div class="w-full max-w-md flex flex-col flex-grow z-10 px-6 pt-12 pb-6">

        <!-- Illustration Section -->
        <div class="flex-grow flex flex-col items-center justify-center min-h-[300px] relative">
            <!-- Pulsing Rings -->
            <div class="absolute w-[300px] h-[300px] flex items-center justify-center pointer-events-none">
                <div class="map-pulse-ring"></div>
                <div class="map-pulse-ring"></div>
                <div class="map-pulse-ring"></div>
            </div>

            <!-- Map Pin Icon -->
            <div class="relative z-10 bg-surface-dark p-6 rounded-full shadow-[0_0_40px_rgba(56,255,20,0.15)] border border-white/5">
                <span class="material-symbols-outlined text-primary text-[64px]" style="font-size: 64px;">location_on</span>
            </div>

            <!-- Map Decorative Elements -->
            <div class="absolute inset-0 opacity-20 pointer-events-none"
                style="background-image: radial-gradient(#38ff14 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(circle at center, black 0%, transparent 70%); -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);">
            </div>
        </div>

        <!-- Text Content -->
        <div class="w-full mb-8 text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-white leading-tight">
                Allow Location Access
            </h1>
            <p class="text-slate-400 text-sm leading-relaxed max-w-xs mx-auto">
                We need your location to provide a better and faster pitch booking experience for you.
            </p>
        </div>

        <!-- Benefits List -->
        <div class="w-full space-y-4 mb-8">
            <!-- Item 1 -->
            <div class="flex items-center gap-4 bg-white/5 p-4 rounded-xl border border-white/5 backdrop-blur-sm transition-transform active:scale-[0.99]">
                <div class="flex items-center justify-center rounded-lg bg-primary/10 shrink-0 h-10 w-10 text-primary">
                    <span class="material-symbols-outlined">near_me</span>
                </div>
                <p class="text-slate-100 text-base font-medium flex-1">Show nearest pitches to you</p>
                <span class="material-symbols-outlined text-primary">check_circle</span>
            </div>

            <!-- Item 2 -->
            <div class="flex items-center gap-4 bg-white/5 p-4 rounded-xl border border-white/5 backdrop-blur-sm transition-transform active:scale-[0.99]">
                <div class="flex items-center justify-center rounded-lg bg-primary/10 shrink-0 h-10 w-10 text-primary">
                    <span class="material-symbols-outlined">straighten</span>
                </div>
                <p class="text-slate-100 text-base font-medium flex-1">Accurately determine distance</p>
                <span class="material-symbols-outlined text-primary">check_circle</span>
            </div>

            <!-- Item 3 -->
            <div class="flex items-center gap-4 bg-white/5 p-4 rounded-xl border border-white/5 backdrop-blur-sm transition-transform active:scale-[0.99]">
                <div class="flex items-center justify-center rounded-lg bg-primary/10 shrink-0 h-10 w-10 text-primary">
                    <span class="material-symbols-outlined">directions</span>
                </div>
                <p class="text-slate-100 text-base font-medium flex-1">Easy navigation to the pitch</p>
                <span class="material-symbols-outlined text-primary">check_circle</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="w-full space-y-4 mt-auto">
            <!-- Primary Button -->
            <button class="w-full bg-primary hover:bg-primary-dark text-slate-900 font-bold text-lg h-14 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-[0_0_20px_rgba(56,255,20,0.3)] hover:shadow-[0_0_30px_rgba(56,255,20,0.5)]">
                <span class="material-symbols-outlined text-[20px]">my_location</span>
                <span>Enable Location</span>
            </button>

            <!-- Secondary Button -->
            <button class="w-full bg-transparent border-2 border-secondary-blue text-secondary-blue hover:bg-secondary-blue/10 font-bold text-lg h-14 rounded-xl flex items-center justify-center transition-colors">
                Not Now
            </button>
        </div>

        <!-- Safe Area Spacer for iOS Home Indicator -->
        <div class="h-2 w-full"></div>
    </div>

</body>
</html>
