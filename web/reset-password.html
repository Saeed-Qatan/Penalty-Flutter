<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plenalty - Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #121212;
      --surface: #1E1E1E;
      --neon-green: #39FF14;
      --neon-green-dim: rgba(57, 255, 20, 0.15);
      --neon-green-glow: rgba(57, 255, 20, 0.3);
      --white: #FFFFFF;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --border: #2A2A2A;
      --divider: #333333;
      --error: #EF4444;
      --success: #22C55E;
    }

    body {
      font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Background glow effects */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--neon-green-dim) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      left: -200px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(41, 121, 255, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo / Icon */
    .icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--neon-green-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--neon-green-dim);
      animation: pulse 2s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 20px var(--neon-green-dim); }
      100% { box-shadow: 0 0 40px var(--neon-green-glow); }
    }

    .icon-circle svg {
      width: 36px;
      height: 36px;
      color: var(--neon-green);
    }

    /* Headings */
    .title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: var(--bg);
      border: 1px solid var(--divider);
      border-radius: 10px;
      color: var(--white);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 0 3px var(--neon-green-dim);
    }

    .input-field.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .input-field::placeholder {
      color: var(--text-secondary);
    }

    .toggle-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--white);
    }

    /* Strength indicator */
    .strength-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .strength-segment {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: var(--divider);
      transition: background 0.3s;
    }

    .strength-segment.active-weak { background: var(--error); }
    .strength-segment.active-medium { background: #F59E0B; }
    .strength-segment.active-strong { background: var(--neon-green); }

    .strength-label {
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: left;
      direction: ltr;
    }

    /* Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--neon-green);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px var(--neon-green-glow);
      margin-top: 8px;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px var(--neon-green-glow);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--bg);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error / Success messages */
    .message {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.error {
      background: rgba(239, 68, 68, 0.12);
      color: #FCA5A5;
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: block;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.12);
      color: #86EFAC;
      border: 1px solid rgba(34, 197, 94, 0.2);
      display: block;
    }

    /* Success State */
    .success-view {
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--bg);
      border: 3px solid var(--neon-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 40px var(--neon-green-glow);
      animation: successPop 0.5s ease-out;
    }

    @keyframes successPop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-icon svg {
      width: 48px;
      height: 48px;
      color: var(--neon-green);
    }

    .success-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .success-subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Loading state */
    .loading-view {
      text-align: center;
      padding: 40px 0;
    }

    .loading-spinner-large {
      width: 48px;
      height: 48px;
      border: 4px solid var(--divider);
      border-top-color: var(--neon-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 15px;
    }

    /* Error state */
    .error-view {
      text-align: center;
      padding: 20px 0;
    }

    .error-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      border: 2px solid rgba(239, 68, 68, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .error-icon svg {
      width: 36px;
      height: 36px;
      color: var(--error);
    }

    .error-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .error-subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* Brand footer */
    .brand {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .brand strong {
      color: var(--neon-green);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Loading State -->
      <div id="loading-state">
        <div class="loading-view">
          <div class="loading-spinner-large"></div>
          <p class="loading-text">جاري التحقق...</p>
        </div>
      </div>

      <!-- Error State (invalid/expired link) -->
      <div id="error-state" style="display: none;">
        <div class="error-view">
          <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
          </div>
          <h2 class="error-title">رابط غير صالح</h2>
          <p class="error-subtitle" id="error-detail">هذا الرابط غير صالح أو منتهي الصلاحية. يرجى طلب رابط جديد من التطبيق.</p>
          <a href="javascript:void(0)" class="submit-btn" onclick="window.close()">إغلاق</a>
        </div>
      </div>

      <!-- Reset Form -->
      <div id="form-state" style="display: none;">
        <div class="icon-wrapper">
          <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
          </div>
        </div>

        <h1 class="title">إعادة تعيين كلمة المرور</h1>
        <p class="subtitle">أنشئ كلمة مرور جديدة وقوية لحسابك</p>

        <div id="form-message" class="message"></div>

        <form id="reset-form" onsubmit="handleSubmit(event)">
          <!-- New Password -->
          <div class="form-group">
            <label class="form-label">كلمة المرور الجديدة</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="new-password"
                class="input-field"
                placeholder="••••••••"
                required
                minlength="8"
                oninput="updateStrength(this.value)"
              />
              <button type="button" class="toggle-password" onclick="togglePassword('new-password', this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            </div>
            <div class="strength-bar" id="strength-bar">
              <div class="strength-segment" id="seg-1"></div>
              <div class="strength-segment" id="seg-2"></div>
              <div class="strength-segment" id="seg-3"></div>
            </div>
            <div class="strength-label" id="strength-label"></div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label">تأكيد كلمة المرور الجديدة</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="confirm-password"
                class="input-field"
                placeholder="••••••••"
                required
                minlength="8"
              />
              <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            إعادة تعيين كلمة المرور
          </button>
        </form>
      </div>

      <!-- Success State -->
      <div id="success-state" style="display: none;">
        <div class="success-view">
          <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          </div>
          <h2 class="success-title">تم بنجاح! ✅</h2>
          <p class="success-subtitle">تم إعادة تعيين كلمة المرور بنجاح.<br/>يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة من التطبيق.</p>
          <button class="submit-btn" onclick="window.close()">إغلاق الصفحة</button>
        </div>
      </div>
    </div>

    <p class="brand">Powered by <strong>PLENALTY</strong> ⚽</p>
  </div>

  <script>
    // ─── Supabase Config ───
    const SUPABASE_URL = 'https://rscgxudheornmajpwtok.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzY2d4dWRoZW9ybm1hanB3dG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTk0MzYsImV4cCI6MjA5MDc5NTQzNn0.G_UHmqzVmmRyTjIKodaZCCzksxZjoZZ-UPAUSQGzw0E';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ─── State Helpers ───
    function showState(stateId) {
      ['loading-state', 'error-state', 'form-state', 'success-state'].forEach(id => {
        document.getElementById(id).style.display = id === stateId ? 'block' : 'none';
      });
    }

    // ─── Initialize ───
    async function init() {
      try {
        // Parse the hash fragment from Supabase redirect
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);

        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        const type = params.get('type');

        if (!accessToken || type !== 'recovery') {
          showState('error-state');
          return;
        }

        // Set the session from the URL tokens
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });

        if (error) {
          document.getElementById('error-detail').textContent = error.message;
          showState('error-state');
          return;
        }

        showState('form-state');
      } catch (e) {
        console.error(e);
        showState('error-state');
      }
    }

    // ─── Password Strength ───
    function updateStrength(password) {
      const seg1 = document.getElementById('seg-1');
      const seg2 = document.getElementById('seg-2');
      const seg3 = document.getElementById('seg-3');
      const label = document.getElementById('strength-label');

      // Reset
      [seg1, seg2, seg3].forEach(s => s.className = 'strength-segment');
      label.textContent = '';

      if (!password) return;

      const hasLetters = /[a-zA-Z]/.test(password);
      const hasNumbers = /[0-9]/.test(password);
      const hasSymbols = /[!@#$&*~]/.test(password);

      if (password.length >= 8 && hasLetters && hasNumbers && hasSymbols) {
        seg1.classList.add('active-strong');
        seg2.classList.add('active-strong');
        seg3.classList.add('active-strong');
        label.textContent = 'Strong 💪';
        label.style.color = 'var(--neon-green)';
      } else if (password.length >= 6 && hasLetters && hasNumbers) {
        seg1.classList.add('active-medium');
        seg2.classList.add('active-medium');
        label.textContent = 'Medium';
        label.style.color = '#F59E0B';
      } else {
        seg1.classList.add('active-weak');
        label.textContent = 'Weak';
        label.style.color = 'var(--error)';
      }
    }

    // ─── Toggle Password Visibility ───
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
    }

    // ─── Form Submit ───
    async function handleSubmit(e) {
      e.preventDefault();
      const formMessage = document.getElementById('form-message');
      const submitBtn = document.getElementById('submit-btn');
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Reset error state
      formMessage.className = 'message';
      formMessage.textContent = '';
      document.getElementById('new-password').classList.remove('error');
      document.getElementById('confirm-password').classList.remove('error');

      // Validate
      if (newPassword.length < 8) {
        formMessage.className = 'message error';
        formMessage.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
        document.getElementById('new-password').classList.add('error');
        return;
      }

      if (newPassword !== confirmPassword) {
        formMessage.className = 'message error';
        formMessage.textContent = 'كلمات المرور غير متطابقة';
        document.getElementById('confirm-password').classList.add('error');
        return;
      }

      // Submit
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>';

      try {
        const { error } = await supabase.auth.updateUser({
          password: newPassword,
        });

        if (error) {
          formMessage.className = 'message error';
          formMessage.textContent = error.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'إعادة تعيين كلمة المرور';
          return;
        }

        showState('success-state');
      } catch (err) {
        formMessage.className = 'message error';
        formMessage.textContent = 'حدث خطأ. يرجى المحاولة مرة أخرى.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'إعادة تعيين كلمة المرور';
      }
    }

    // ─── Start ───
    init();
  </script>
</body>
</html>
